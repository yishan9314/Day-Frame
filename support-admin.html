<section data-da-panel="support" hidden id="sf-admin"><div class="sf-admin-nav" aria-label="客服管理功能"><button data-sf-admin-tab="cases" class="da-primary">案件工作台</button><button data-sf-admin-tab="faq" class="da-outline" data-sf-owner>FAQ 維護</button><button data-sf-admin-tab="policies" class="da-outline" data-sf-owner>正式政策</button><button data-sf-admin-tab="audit" class="da-outline" data-sf-owner>操作稽核</button><button data-sf-admin-tab="notifications" class="da-outline" data-sf-owner>通知紀錄</button><button data-sf-admin-tab="staff" class="da-outline" data-sf-owner>客服帳號</button></div><p id="sf-admin-status" class="da-message" role="status" aria-live="polite"></p>
 <div data-sf-admin-panel="cases"><div id="sf-case-metrics" class="da-metrics"></div><form id="sf-admin-filter" class="sf-admin-filters"><label>關鍵字<input name="q" type="search" placeholder="案件、訂單、姓名、問題"></label><label>類型<select name="kind"><option value="">全部類型</option><option value="return">退貨</option><option value="complaint">客訴／售後</option></select></label><label>狀態<select name="status" id="sf-admin-status-filter"></select></label><label>分類<select name="category" id="sf-admin-category-filter"></select></label><label>起日<input name="from" type="date"></label><label>迄日<input name="to" type="date"></label><button class="da-primary">搜尋案件</button><button class="da-outline" type="reset">清除篩選</button></form><div class="da-table-wrap"><table><caption>退貨與售後案件</caption><thead><tr><th>案件／類型</th><th>顧客／分類</th><th>狀態</th><th>優先級</th><th>負責人</th><th>建立日期</th><th>操作</th></tr></thead><tbody id="sf-admin-case-list"></tbody></table></div><div id="sf-admin-case-detail" class="sf-admin-detail" hidden></div></div>
 <div data-sf-admin-panel="faq" hidden><div class="da-card"><h2>新增／編輯 FAQ</h2><form id="sf-faq-edit" class="sf-admin-form"><input type="hidden" name="id"><input type="hidden" name="version"><label>分類<select name="category" id="sf-faq-edit-category"></select></label><label>問題<input name="question" required maxlength="300"></label><label>回答<textarea name="answer" required rows="5" maxlength="8000"></textarea></label><label class="sf-check"><input name="published" type="checkbox"> 發布至前台（取消勾選即下架）</label><div class="sf-actions"><button class="da-primary">儲存 FAQ</button><button class="da-outline" type="button" id="sf-faq-new">清空並新增</button></div></form></div><div id="sf-faq-admin-list"></div></div>
 <div data-sf-admin-panel="policies" hidden><div class="da-note">未發布或空白的正式政策會顯示「尚未設定」。請由授權人員確認內容後發布；本系統不預設退貨期限、退款天數或保固期間。</div><div id="sf-policy-admin-list"></div></div>
 <div data-sf-admin-panel="audit" hidden><div class="da-table-wrap"><table><caption>最近500筆重要操作（僅管理員可讀，無修改／刪除介面）</caption><thead><tr><th>時間</th><th>操作人</th><th>動作</th><th>對象</th><th>紀錄</th></tr></thead><tbody id="sf-audit-list"></tbody></table></div></div>
 <div data-sf-admin-panel="notifications" hidden><p class="sf-notice" id="sf-notify-config"></p><div class="da-table-wrap"><table><caption>最近200筆電子郵件通知</caption><thead><tr><th>案件</th><th>通知</th><th>收件人</th><th>狀態</th><th>說明</th><th>操作</th></tr></thead><tbody id="sf-notify-list"></tbody></table></div></div>
 <div data-sf-admin-panel="staff" hidden><form id="sf-staff-form" class="da-card sf-admin-form"><h2>新增授權客服帳號</h2><label>帳號<input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]{3,32}" autocomplete="off"></label><label>密碼（至少12字）<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><label>權限<select name="role"><option value="agent">客服：案件處理，無FAQ／政策／稽核管理權</option><option value="admin">管理員：可審核、管理政策、FAQ、帳號及稽核</option></select></label><button class="da-primary">建立客服帳號</button></form><div id="sf-staff-list" class="da-card"></div></div>
</section>
